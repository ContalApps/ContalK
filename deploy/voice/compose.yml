name: contalk-turn
services:
  turn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    environment:
      # Runtime-only: Compose also evaluates this file while preparing the deployment.
      CONTALK_TURN_SECRET: ${CONTALK_TURN_SECRET:-}
      CONTALK_MEDIA_PUBLIC_IP: ${CONTALK_MEDIA_PUBLIC_IP:?Set the public IPv4}
      # Restrict this to the dedicated SFU Docker subnet when hairpin NAT uses
      # its private address. Without it, only the public SFU IPv4 is allowed.
      CONTALK_TURN_PRIVATE_PEER_RANGE: ${CONTALK_TURN_PRIVATE_PEER_RANGE:-${CONTALK_MEDIA_PUBLIC_IP}}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test -n "$$CONTALK_TURN_SECRET" || exit 1
        peer_start="$${CONTALK_TURN_PRIVATE_PEER_RANGE%%-*}"
        peer_prefix="$${peer_start%.*}."
        relay_ip=""
        for address in $$(hostname -I); do
          case "$$address" in "$$peer_prefix"*) relay_ip="$$address"; break;; esac
        done
        set --
        if [ -n "$$relay_ip" ]; then set -- --relay-ip="$$relay_ip"; fi
        exec turnserver "$$@" -n --no-cli --no-tls --no-dtls --fingerprint --pidfile=/tmp/turnserver.pid \
          --use-auth-secret --static-auth-secret="$$CONTALK_TURN_SECRET" \
          --realm=contalapps.com.br --external-ip="$$CONTALK_MEDIA_PUBLIC_IP" \
          --listening-port=3478 --min-port=49160 --max-port=49200 \
          --total-quota=32 --user-quota=8 --no-multicast-peers \
          --denied-peer-ip=0.0.0.0-255.255.255.255 \
          --allowed-peer-ip="$$CONTALK_MEDIA_PUBLIC_IP" \
          --allowed-peer-ip="$$CONTALK_TURN_PRIVATE_PEER_RANGE" --log-file=stdout --simple-log
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    # The official coturn binary carries this file capability; keep it in the
    # bounding set so Linux can execute the binary even on unprivileged ports.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    networks: [media]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "kill -0 1 && grep -qi ':0D96 ' /proc/net/udp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  media:
    external: true
    name: ${CONTALK_COMMUNITY_NETWORK}
