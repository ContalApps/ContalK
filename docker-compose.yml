services:
  livekit:
    image: livekit/livekit-server:latest
    container_name: contalspeak-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --config /etc/livekit.yaml --node-ip 127.0.0.1 --udp-port 7882
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  token-server:
    image: node:20-alpine
    container_name: contalspeak-token-server
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./scripts/token-server.mjs:/app/index.mjs:ro
    ports:
      - "3001:3001"
    command: ["sh", "-c", "npm install livekit-server-sdk && node /app/index.mjs"]
    depends_on:
      - livekit
