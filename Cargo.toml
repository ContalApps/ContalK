[workspace]
members = ["src-tauri", "crates/contalspeak-core"]
resolver = "2"

[workspace.package]
version = "0.1.20"
edition = "2024"
license = "MIT"
authors = ["ConTALK Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
