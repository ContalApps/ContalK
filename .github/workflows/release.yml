name: Release ConTALK Electron

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build isolated audio helper
        run: npm run build:audio
      - name: Typecheck and test
        run: npm run verify
      - name: Build Windows installer
        run: npm run build:electron
      - name: Publish installer and update feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:electron
